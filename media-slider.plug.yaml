name: media-slider
requiredPermissions: []
build:
  - type: sass
    in: styles.scss
    out: styles.css
assets:
  - "styles.css"
  - "slider_runtime.js"
functions:
  mediaSliderWidget:
    path: ./media_slider.ts:mediaSliderWidget
    codeWidget: media-slider
    renderMode: iframe
  mediaSliderHelp:
    path: ./media_slider.ts:mediaSliderHelp
    command:
      name: "Media Slider: Help"