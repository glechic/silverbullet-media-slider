name: media-slider
requiredPermissions: []
build:
  - type: sass
    in: ../src/styles.scss
    out: styles.css
  - in: ../src/ui/index.tsx
    out: slider_ui.js
assets:
  - "styles.css"
  - "slider_ui.js"
functions:
  mediaSliderWidget:
    path: ../src/media_slider.ts:mediaSliderWidget
    codeWidget: media-slider
    renderMode: iframe
  mediaSliderHelp:
    path: ../src/media_slider.ts:mediaSliderHelp
    command:
      name: "Media Slider: Help"