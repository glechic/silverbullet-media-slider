name: media-slider
requiredPermissions: []
build:
  - type: sass
    in: ../src/styles.scss
    out: styles.css
  - type: copy
    in: ../src/slider_runtime.js
    out: slider_runtime.js
assets:
  - "styles.css"
  - "slider_runtime.js"
functions:
  mediaSliderWidget:
    path: ../src/media_slider.ts:mediaSliderWidget
    codeWidget: media-slider
    renderMode: iframe
  mediaSliderHelp:
    path: ../src/media_slider.ts:mediaSliderHelp
    command:
      name: "Media Slider: Help"